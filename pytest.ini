[pytest]
# pytest configuration file

# Minimum version
minversion = 6.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -ra
    --strict-markers
    --cov=.
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --junitxml=test-results/junit.xml
    --tb=short
    --maxfail=10
    -v

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    component: marks tests as component tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
    performance: marks tests as performance tests
    benchmark: marks tests as benchmark tests
    requires_gpu: marks tests that require GPU
    requires_api_key: marks tests that require API keys
    requires_faiss: marks tests that require FAISS dependency
    requires_milvus: marks tests that require Milvus dependency
    network: marks tests that require network connectivity
    asyncio: marks tests as async

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Asyncio
asyncio_mode = auto

# Timeout
timeout = 300
timeout_method = thread

# Environment variables for tests
env =
    TESTING = true
    D:OMP_NUM_THREADS = 1
    D:OPENBLAS_NUM_THREADS = 1
    LOG_LEVEL = DEBUG
    PYTHONPATH = .