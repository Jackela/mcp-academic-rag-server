name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Explicit container publication target; ordinary checks do not publish'
        type: choice
        required: true
        default: none
        options: [none, staging, production]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start real Milvus dependencies
        run: docker compose -f .github/milvus-ci.yml up -d --wait --wait-timeout 180

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 \
            libhdf5-dev \
            libopenblas-dev \
            liblapack-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libavcodec-dev \
            libavformat-dev \
            libswscale-dev \
            libv4l-dev \
            libgtk-3-dev \
            libatlas-base-dev \
            gfortran

      - name: Install Python dependencies
        run: |
          python -m venv .venv-project
          .venv-project/bin/python -m pip install --upgrade pip setuptools wheel
          .venv-project/bin/python -m pip install -r requirements.txt
          echo "$PWD/.venv-project/bin" >> "$GITHUB_PATH"

      - name: Create test configuration
        run: |
          mkdir -p config
          cp config/config.json.example config/config.json

      - name: Verify native dependencies
        run: |
          python -X faulthandler -m scripts.check_native_runtime
        env:
          KMP_DUPLICATE_LIB_OK: 'FALSE'

      - name: Run linting
        run: |
          python -m black --check .
          python -m isort --check-only .
          python -m flake8 .

      - name: Run type checking
        run: python -m mypy --explicit-package-bases core processors connectors models rag utils servers document_stores retrievers cli

      - name: Run security checks
        run: |
          python scripts/check_bandit.py core processors connectors models rag utils servers document_stores retrievers cli scripts app.py webapp.py --output bandit-report.json
          python -m pip_audit --local --format json --output dependency-audit-report.json

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --cov=. --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --cov-append --cov=. --cov-report=xml
        env:
          PYTHONPATH: ${{ github.workspace }}
          MILVUS_HOST: localhost
          MILVUS_PORT: 19530

      - name: Run component tests
        run: |
          python -m pytest tests/component/ -v --cov-append --cov=. --cov-report=xml
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Stop Milvus dependencies
        if: always()
        run: docker compose -f .github/milvus-ci.yml down -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            coverage.xml
            bandit-report.json
            bandit-report-all.json
            dependency-audit-report.json

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-benchmark memory-profiler

      - name: Run performance tests
        run: |
          python -m pytest tests/performance/ -v --junitxml=test-results/junit-performance.xml
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: test-results/junit-performance.xml

  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start real Milvus dependencies
        run: docker compose -f .github/milvus-ci.yml up -d --wait --wait-timeout 180

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install normal browser for Web E2E
        run: python -m playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          python -m pytest tests/e2e/ -v --maxfail=1
        env:
          PYTHONPATH: ${{ github.workspace }}
          MILVUS_HOST: localhost
          MILVUS_PORT: 19530
          HEADLESS: true

      - name: Stop Milvus dependencies
        if: always()
        run: docker compose -f .github/milvus-ci.yml down -v

  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize container repository name
        run: |
          container_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_NAME=%s\n' "$container_repository" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dependency validation image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-validation
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:dependency-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image
        id: runtime_image_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python for the official MCP client
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test installed Docker entry and real stdio
        env:
          CONTAINER_IMAGE_MANIFEST: ${{ steps.runtime_image_build.outputs.digest }}
        run: |
          python -m pip install 'mcp>=1,<2'
          python scripts/check_container.py "${{ env.IMAGE_NAME }}:test" --dependency-image "${{ env.IMAGE_NAME }}:dependency-validation" --receipt container-runtime-receipt.json

      - name: Upload actual container inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-runtime-evidence
          path: container-runtime-receipt.json

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize container repository name
        run: |
          container_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_NAME=%s\n' "$container_repository" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dependency validation image for scan verification
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-validation
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan-dependency-validation
          cache-from: type=gha

      - name: Build image for scanning
        id: scan_image_build
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha

      - name: Set up Python for scan-image MCP verification
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify the actual image that Trivy scans
        env:
          CONTAINER_IMAGE_MANIFEST: ${{ steps.scan_image_build.outputs.digest }}
        run: |
          python -m pip install 'mcp>=1,<2'
          python scripts/check_container.py "${{ env.IMAGE_NAME }}:scan" --dependency-image "${{ env.IMAGE_NAME }}:scan-dependency-validation" --receipt scan-runtime-receipt.json

      - name: Preserve actual scanned-image inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanned-container-runtime-evidence
          path: scan-runtime-receipt.json

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Preserve complete unsuppressed Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-trivy-report
          path: trivy-results.sarif

  deploy-staging:
    name: Publish Staging Image
    runs-on: ubuntu-latest
    needs: [test, e2e-test, docker-build, security-scan]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'staging'
    permissions:
      contents: read
      packages: write

    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize container repository name
        run: |
          container_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_NAME=%s\n' "$container_repository" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Publish Production Image
    runs-on: ubuntu-latest
    needs: [test, e2e-test, docker-build, security-scan]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'production'
    permissions:
      contents: read
      packages: write

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize container repository name
        run: |
          container_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_NAME=%s\n' "$container_repository" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish Existing Release Image
    runs-on: ubuntu-latest
    needs: [test, e2e-test, docker-build, security-scan]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize container repository name
        run: |
          container_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_NAME=%s\n' "$container_repository" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Use existing release tag
        id: version
        run: echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate changelog
        run: python scripts/release_changelog.py --tag "$GITHUB_REF_NAME" --github-env "$GITHUB_ENV"

      - name: Update release notes
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id
            });
            
            const changelog = process.env.CHANGELOG;
            if (typeof changelog !== 'string') throw new Error('Missing release changelog');
            const body = (release.data.body || '') + "\n\n## Changes\n" + changelog;
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: body
            });
