name: Test Only Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distributable wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel into isolated environment
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install dist/*.whl
      - name: Validate installed entry points and real stdio
        run: .venv-wheel/bin/python scripts/check_installed_wheel.py
      - name: Run MCP and OCR contracts without external services
        run: |
          .venv-wheel/bin/python -m unittest discover -s tests/contracts -v
          .venv-wheel/bin/python -m unittest discover -s tests/unit -p test_ocr_processor.py -v
      - name: Install and verify optional monitoring wheel
        run: |
          .venv-wheel/bin/python -m pip install 'mcp-academic-rag-server[monitoring]'
          PYTHONDONTWRITEBYTECODE=1 .venv-wheel/bin/python scripts/check_monitoring_wheel.py
