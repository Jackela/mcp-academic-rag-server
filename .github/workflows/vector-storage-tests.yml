name: Vector Storage Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'document_stores/**'
      - 'document_stores/migration/vector_migration.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/vector-storage-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'document_stores/**'
      - 'document_stores/migration/vector_migration.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'

env:
  PYTHONUNBUFFERED: 1
  TESTING: true
  LOG_LEVEL: INFO

jobs:
  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy
          pip install -r requirements.txt

      - name: Run Black
        run: black --check --diff document_stores/ tests/

      - name: Run isort
        run: isort --check-only --diff document_stores/ tests/

      - name: Run Flake8
        run: python -m flake8 document_stores/ tests/

      - name: Run MyPy
        run: python -m mypy --explicit-package-bases document_stores/

  unit-tests:
    name: Unit Tests
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        exclude:
          # Reduce test matrix for faster runs
          - os: windows-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.10'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmagic1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist pytest-timeout
          pip install -r requirements.txt

      - name: Install optional dependencies
        run: |
          # Install FAISS for testing
          pip install faiss-cpu
          # Note: Milvus requires Docker, skip in CI

      - name: Verify native dependencies
        run: |
          python -X faulthandler -c "import torch; import faiss; print('native imports:', torch.__version__, faiss.__version__); assert torch.tensor([1, 2]).sum().item() == 3"

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            --cov=document_stores \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results/junit-unit.xml \
            -v \
            --durations=10 \
            -m "not slow and not benchmark"

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unit
          name: unit-tests
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist pytest-timeout
          pip install -r requirements.txt
          pip install faiss-cpu

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --cov=document_stores \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results/junit-integration.xml \
            -v \
            --durations=10 \
            -m "not slow and not requires_milvus"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: integration
          name: integration-tests
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration-${{ matrix.python-version }}
          path: test-results/

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark
          pip install -r requirements.txt
          pip install faiss-cpu

      - name: Run performance tests
        run: |
          pytest tests/performance/ \
            --junitxml=test-results/junit-performance.xml \
            -v \
            --durations=20 \
            -m "benchmark" \
            --timeout=600

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: test-results/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv .venv-project
          .venv-project/bin/python -m pip install --upgrade pip setuptools wheel
          .venv-project/bin/python -m pip install -r requirements.txt
          echo "$PWD/.venv-project/bin" >> "$GITHUB_PATH"
          python -m venv .venv-security-tools
          .venv-security-tools/bin/python -m pip install semgrep

      - name: Audit installed project dependencies
        run: python -m pip_audit --local --format json --output dependency-audit-report.json

      - name: Run Bandit security scan
        run: |
          python scripts/check_bandit.py document_stores/ --output bandit-report.json

      - name: Run Semgrep
        run: |
           .venv-security-tools/bin/semgrep --config=auto --error --json --output=semgrep-report.json \
            document_stores/

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            dependency-audit-report.json
            bandit-report.json
            bandit-report-all.json
            semgrep-report.json

  docker-tests:
    name: Docker Environment Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start the declared CI Milvus service
        run: docker compose -f .github/milvus-ci.yml up -d --wait --wait-timeout 180

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv .venv-service
          .venv-service/bin/python -m pip install --upgrade pip setuptools wheel
          python -c 'import os, pathlib, tomllib; spec = tomllib.loads(pathlib.Path("pyproject.toml").read_text()); pathlib.Path(os.environ["RUNNER_TEMP"], "storage-tests.txt").write_text("\n".join(spec["project"]["optional-dependencies"]["storage-tests"]))'
          .venv-service/bin/python -m pip install -r "$RUNNER_TEMP/storage-tests.txt"

      - name: Verify real Milvus service SDK contract
        run: .venv-service/bin/python scripts/check_milvus_service.py --host 127.0.0.1 --port 19530

      - name: Stop only this CI Milvus service
        if: always()
        run: docker compose -f .github/milvus-ci.yml down -v

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests, security-scan]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: all-test-results/

      - name: Publish test summary
        run: |
          echo "## Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "✅ Unit Tests: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Unit Tests: Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ Integration Tests: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Integration Tests: Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ "${{ needs.performance-tests.result }}" == "success" ]; then
            echo "✅ Performance Tests: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Performance Tests: ${{ needs.performance-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ Security Scan: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Security Scan: ${{ needs.security-scan.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi
